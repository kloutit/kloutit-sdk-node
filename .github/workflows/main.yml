# Stages a new release on NPM via trusted publishing (GitHub Actions OIDC): no
# npm token is stored in the repo. The trusted publisher configured on npmjs.com
# for this repository and workflow file only allows staged publishes, so the
# version is NOT live after this job: a maintainer reviews and approves it with
# 2FA (`npm stage approve <stage-id>` or on npmjs.com) before it is published.
# https://www.npmjs.com/package/@kloutit/kloutit-sdk
name: Publish release to NPM

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Staged publishing needs npm >= 11.15. npm 11 is the line that runs on
      # Node 24; npm@latest (12+) requires a newer Node than the runner ships.
      - run: npm install -g npm@11
      - run: |
          npm install
          npm run build
      - run: |
          if [[ "${{ github.event.release.tag_name }}" == *"beta"* ]]; then
            npm stage publish --tag beta
          else
            npm stage publish
          fi
