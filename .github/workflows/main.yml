# Publish a new release on NPM via trusted publishing (GitHub Actions OIDC):
# no npm token is stored in the repo. The trusted publisher is configured on
# npmjs.com for this repository and this workflow file.
# https://www.npmjs.com/package/@kloutit/kloutit-sdk
name: Publish release to NPM

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10
      - run: npm install -g npm@latest
      - run: |
          npm install
          npm run build
      - run: |
          if [[ "${{ github.event.release.tag_name }}" == *"beta"* ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
